{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Deportes UNCa{% endblock %}</title>

    <!-- Link CSS Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link href="{% static 'css/estilos.css' %}" rel="stylesheet" />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <!-- ENCABEZADO -->
    <header>
      <nav class="navbar">
        <div
          class="container-fluid d-flex flex-column flex-md-row align-items-center"
        >
          <a class="navbar-brand" href="https://www.unca.edu.ar/">
            <img
              src="{% static 'img/logo unca2.png' %}"
              alt="Logo"
              class="img-fluid"
              style="max-width: 200px"
            />
          </a>
          <h1 class="text-center mt-3 mt-md-0 ms-md-3">
            Plataforma de Actividades Deportivas
          </h1>
        </div>
      </nav>
    </header>

    <!-- MENÚ PRINCIPAL -->
    <nav class="navbar" style="background-color: #011325" data-bs-theme="dark">
      <div
        class="nav nav-tabs flex-nowrap overflow-auto"
        id="nav-tab"
        role="tablist"
      >
        <a
          class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}"
          href="{% url 'index' %}"
          >Inicio</a
        >

        <a
          class="nav-link {% if request.resolver_match.url_name == 'registrarse' %}active{% endif %}"
          href="{% url 'registrarse' %}"
          >Registrarse</a
        >

        <a
          class="nav-link {% if request.resolver_match.url_name == 'lista_actividades' %}active{% endif %}"
          href="{% url 'lista_actividades' %}"
          >Actividades Deportivas</a
        >

        <a
          class="nav-link {% if request.resolver_match.url_name == 'inscribirse' %}active{% endif %}"
          href="{% url 'inscribirse' %}"
          >Inscribirse a una Actividad</a
        >

        <a
          class="nav-link {% if request.resolver_match.url_name == 'mis_inscripciones' %}active{% endif %}"
          href="{% url 'mis_inscripciones' %}"
          >Mis Inscripciones</a
        >

        <button class="nav-link disabled" type="button" aria-disabled="true">
          Cancelar Suscripción
        </button>
        <button class="nav-link disabled" type="button" aria-disabled="true">
          Iniciar Sesión
        </button>
      </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main
      class="container-fluid flex-grow-1 d-flex justify-content-center align-items-center p-4"
    >
      {% block content %} {% endblock %}
    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="text-light text-center py-3 mt-5">
      <p class="mb-0">&copy; <em>Deportes UNCa - 2026</em></p>
    </footer>

    <!-- VINCULAR LAS FUNCIONALIDADES DE JAVASCRIPT -->
    <script src="{% static 'js/main.js' %}"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
